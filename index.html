<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />

    <title>budget tracker</title>
  </head>
  <body>
    <h1 class="h1 text-center">Budget Tracker System</h1>
    <div class="container c1">
      <div class="tracker-main-box">
        <div class="row">
          <div class="col-md-4">
            <div class="box-card">
              <h5>Add Budget</h5>

              <label for="budget">Budget:</label>

              <input
                type="number"
                id="budget"
                class="form-control mb-2"
                placeholder="Enter budget"
              />

              <button class="add-budget-btn" onclick="addBudget()">Add Budget</button>
            </div>

            <div class="box-card">
              <h5>Add Expense</h5>

              <label for="expenseName"> Expense Title: </label>

              <input
                type="text"
                id="expenseName"
                class="form-control mb-2"
                placeholder="Enter expense"
              />

              <label for="expenseAmount"> Amount: </label>

              <input
                type="number"
                id="expenseAmount"
                class="form-control mb-2"
                placeholder="Enter amount"
              />

              <button class="add-Expense-btn" onclick="addExpense()">
                Add Expense
              </button>
            </div>

            <button class="reset-btn" onclick="resetAll()">Reset All</button>
          </div>

          <div class="col-md-8">
            <div class="sumry">
              <div class="summary-box">
                Total Budget:
                <p id="totalBudget">0.00</p>
              </div>

              <div class="summary-box">
                Total Expenses:
                <p id="totalExpenses">0.00</p>
              </div>

              <div class="summary-box">
                Budget left:
                <p id="budgetLeft">0.00</p>
              </div>
            </div>

            <div class="expense-title">Expense History:</div>

            <div class="table-responsive">
              <table class="table table-sm">
                <thead>
                  <tr>
                    <th>Expense Name</th>
                    <th>Amount</th>
                    <th>Action</th>
                  </tr>
                </thead>

                <tbody id="expenseList"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
